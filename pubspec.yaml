name: dz6g_app
description: 邓州六高校园墙 App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# ⚠️ 不要删！flutter_html 3.0.0 内部 import 了 package:html 的私有 API
#   package:html/src/query_selector.dart 里的 matches()
# 这个 API 在 html 0.15.5 起被移除，不锁版本会编译报错：
#   flutter_html-3.0.0/lib/src/tree/styled_element.dart:31:17:
#   Error: Method not found: 'matches'.
dependency_overrides:
  html: 0.15.4

flutter:
  uses-material-design: true
